; Config lives here, not at the plugin root, so pytest's rootdir resolves to tests/.
; The plugin root must keep its __init__.py (Hermes' plugin loader requires it), and a rootdir
; containing __init__.py makes pytest try to import that file as a rootdir package, which fails
; because a plugin loaded that way has no parent package to resolve `.recorder` against.
; Run the suite as: pytest tests
[pytest]
addopts = --import-mode=importlib -q
