name: agent-trace
version: "0.1.0"
description: >-
  Renders each agent turn as an interactive span graph: the turn, every LLM provider attempt,
  every tool call, delegated subagents (nested, with their own tool calls), approval and
  human-input prompts, and context compaction, with timings, token counts and per-branch cost.
  Companion to the desktop app's live tool rows: this is the tree nobody shows you. Records
  locally only, with no network egress of any kind. Sanitized capture by default; metadata-only
  mode available for shared machines.
author: "Pedro Abreu (PHLA7)"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
  - on_human_input_request
  - on_human_input_resolved
  - post_compaction
  - on_session_end